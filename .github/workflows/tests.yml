name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Offline end-to-end run (mock provider, no QA, no keys)
        run: python -m media_pipeline run examples/brief.yaml --provider mock --no-qa --max-cost 0 --contact-sheet --out ci-out
